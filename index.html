<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>TZB679の个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            overflow-x: hidden;
            font-family: "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0a0c15;
        }

        /* ========= 滚动容器 + 高性能滚动吸附 ========= */
        .scroll-container {
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            will-change: scroll-position;
        }

        /* 每个区块占满一屏，滚动吸附 */
        .section {
            scroll-snap-align: start;
            min-height: 100vh;
            height: 100vh;
            width: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transform: translateZ(0);
            backface-visibility: hidden;
        }

        /* 区块内容容器 - 入场动画 */
        .section-content {
            width: 90%;
            max-width: 1300px;
            margin: 0 auto;
            padding: 20px;
            z-index: 2;
            position: relative;
            opacity: 0;
            transform: translateY(30px) translateZ(0);
            transition: opacity 0.6s cubic-bezier(0.2, 0.9, 0.4, 1.1), transform 0.6s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            will-change: transform, opacity;
        }

        .section.in-view .section-content {
            opacity: 1;
            transform: translateY(0) translateZ(0);
        }

        /* 动态背景容器 (负责横竖屏切换) */
        .section-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 0;
            transform: translateZ(0);
            transition: background-image 0.25s ease-out;
        }
        /* 半透明遮罩 + 轻微模糊提升可读性 */
        .section-bg::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.52);
            backdrop-filter: blur(3px);
            z-index: 1;
        }

        /* ========= 导航栏（固定顶部） ========= */
        .header-nav {
            width: 100%;
            height: 60px;
            background-color: rgba(255,255,255,0.94);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            padding: 0 24px;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 32px;
            flex-wrap: nowrap;
        }
        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background-image: url("https://ghproxy.net/https://raw.githubusercontent.com/TZB679/myhomepage/refs/heads/main/Assets/small.png");
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
            border: 2px solid #409eff;
        }
        .nav-links {
            display: flex;
            gap: 36px;
        }
        .nav-links a {
            text-decoration: none;
            color: #1f2d3d;
            font-size: 16px;
            font-weight: 500;
            transition: color 0.2s;
        }
        .nav-links a:hover {
            color: #409eff;
        }

        @media (max-width: 680px) {
            .header-nav { padding: 0 16px; height: 56px; }
            .nav-left { gap: 16px; }
            .nav-links { gap: 18px; }
            .nav-links a { font-size: 13px; }
            .avatar { width: 34px; height: 34px; }
        }

        /* ========= 右侧导航圆点 ========= */
        .dot-nav {
            position: fixed;
            right: 24px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1001;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .dot-item {
            width: 10px;
            height: 10px;
            border-radius: 10px;
            background-color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.25s ease;
            border: none;
            padding: 0;
        }
        .dot-item.active {
            width: 28px;
            background-color: #409eff;
            box-shadow: 0 0 8px #409eff;
        }
        @media (max-width: 768px) {
            .dot-nav { right: 14px; gap: 10px; }
            .dot-item { width: 8px; height: 8px; }
            .dot-item.active { width: 22px; }
        }

        /* ========= 各屏内部样式 ========= */
        .section-1 .section-content {
            text-align: center;
            color: white;
            text-shadow: 0 2px 12px rgba(0,0,0,0.5);
        }
        .main-title {
            font-size: clamp(2rem, 8vw, 4rem);
            font-weight: 700;
            margin-bottom: 18px;
            letter-spacing: 2px;
        }
        .sub-punch {
            font-size: clamp(1rem, 4vw, 1.5rem);
            margin-bottom: 40px;
            opacity: 0.9;
        }
        .tag-group {
            display: flex;
            gap: 18px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .tag {
            padding: 8px 26px;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(8px);
            border-radius: 60px;
            font-size: 16px;
            font-weight: 500;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .tag:hover {
            background: #409eff;
            transform: scale(1.02);
        }
        @media (max-width: 550px) {
            .tag { padding: 6px 18px; font-size: 13px; }
            .tag-group { gap: 12px; }
        }

        /* 第二屏卡片 */
        .cards-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 28px;
            justify-content: center;
            margin-top: 30px;
        }
        .core-card {
            background: rgba(20, 25, 40, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 28px 22px;
            flex: 1;
            min-width: 200px;
            text-align: center;
            transition: all 0.3s;
            border: 1px solid rgba(255,255,255,0.2);
            cursor: pointer;
        }
        .core-card:hover {
            transform: translateY(-6px);
            background: rgba(30, 40, 60, 0.85);
            border-color: #409eff;
        }
        .card-icon-big {
            font-size: 48px;
            margin-bottom: 16px;
        }
        .core-card h3 {
            color: white;
            font-size: 1.6rem;
            margin-bottom: 8px;
        }
        .core-card p {
            color: #ccc;
            font-size: 14px;
        }
        .section-title {
            font-size: clamp(1.6rem, 5vw, 2.4rem);
            color: white;
            text-align: center;
            margin-bottom: 40px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        @media (max-width: 700px) {
            .cards-grid { gap: 16px; }
            .core-card { padding: 20px 16px; min-width: 150px; }
            .card-icon-big { font-size: 38px; }
            .core-card h3 { font-size: 1.3rem; }
        }

        /* 第三屏 全新设计：点击耳机下载1首歌 */
        .song-download-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(18px);
            border-radius: 72px;
            padding: 52px 36px;
            max-width: 750px;
            margin: 0 auto;
            border: 1px solid rgba(255, 215, 150, 0.3);
            transition: all 0.3s ease;
        }
        .download-headphone {
            background: linear-gradient(145deg, #2c2f3a, #1a1c26);
            width: 140px;
            height: 140px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.2);
            box-shadow: 0 20px 35px -8px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            border: none;
            margin-bottom: 28px;
        }
        .download-headphone:hover {
            transform: scale(1.05);
            background: linear-gradient(145deg, #409eff, #2c6baf);
            box-shadow: 0 28px 40px -12px #409eff80;
        }
        .download-headphone:active {
            transform: scale(0.96);
        }
        .headphone-icon {
            font-size: 68px;
            filter: drop-shadow(2px 6px 12px rgba(0,0,0,0.3));
            color: #ffefc0;
        }
        .download-title {
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            font-weight: 800;
            background: linear-gradient(135deg, #FFE6B0, #FFB347);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }
        .download-desc {
            font-size: 1rem;
            color: rgba(255, 250, 225, 0.85);
            max-width: 380px;
            line-height: 1.5;
            margin-top: 8px;
        }
        .song-meta {
            margin-top: 28px;
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(0, 0, 0, 0.55);
            border-radius: 60px;
            padding: 8px 24px;
            font-size: 14px;
            color: #ffda99;
            backdrop-filter: blur(4px);
        }
        .song-meta span {
            font-size: 16px;
        }
        @media (max-width: 650px) {
            .song-download-area { padding: 36px 24px; }
            .download-headphone { width: 110px; height: 110px; }
            .headphone-icon { font-size: 52px; }
        }

        /* 第四屏商店愿景 */
        .shop-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 40px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 40px 32px;
            margin-top: 20px;
        }
        .shop-info {
            text-align: center;
            flex: 1;
        }
        .shop-info h2 {
            font-size: 2rem;
            color: #ffd966;
            margin-bottom: 16px;
        }
        .shop-btn {
            background: #ff7d00;
            padding: 14px 34px;
            border-radius: 50px;
            display: inline-block;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
            border: none;
        }
        .shop-btn:hover {
            background: #e56c00;
            transform: scale(1.02);
        }
        .vision-text {
            flex: 1;
            color: white;
            font-size: 1.2rem;
            line-height: 1.5;
            text-align: center;
            border-left: 2px solid #409eff;
            padding-left: 30px;
        }
        @media (max-width: 760px) {
            .shop-row { flex-direction: column; padding: 30px 20px; gap: 28px; }
            .vision-text { border-left: none; border-top: 2px solid #409eff; padding-top: 20px; padding-left: 0; }
        }

        /* 第五屏 HI-FI工作室 */
        .hifi-card {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 48px 32px;
            text-align: center;
            max-width: 700px;
            margin: 0 auto;
        }
        .hifi-icon {
            font-size: 72px;
            margin-bottom: 24px;
        }
        .hifi-title {
            font-size: 2.2rem;
            color: #13c2c2;
            margin-bottom: 16px;
        }
        .hifi-desc {
            color: #ddd;
            font-size: 1.1rem;
            margin-bottom: 24px;
        }
        .footer-note {
            margin-top: 40px;
            font-size: 14px;
            color: #aaa;
        }

        /* 全局toast */
        .global-toast {
            transition: opacity 0.2s;
        }
        .scroll-container { scrollbar-width: thin; }
    </style>
</head>

<script>
    (function() {
        // ======================== 横竖屏自适应背景配置 ========================
        const landscapeImages = [
            "https://ghproxy.net/https://raw.githubusercontent.com/TZB679/myhomepage/refs/heads/main/Assets/pic1.jpeg",
            "https://ghproxy.net/https://raw.githubusercontent.com/TZB679/myhomepage/refs/heads/main/Assets/pic2.png",
            "https://ghproxy.net/https://raw.githubusercontent.com/TZB679/myhomepage/refs/heads/main/Assets/pic3.jpg",
            "https://ghproxy.net/https://raw.githubusercontent.com/TZB679/myhomepage/refs/heads/main/Assets/pic4.jpeg",
            "https://ghproxy.net/https://raw.githubusercontent.com/TZB679/myhomepage/refs/heads/main/Assets/pic5.jpg"
        ];
        
        const portraitImages = [
            "https://ghproxy.net/https://raw.githubusercontent.com/TZB679/myhomepage/refs/heads/main/Assets/mobile/mobile3.png",
            "https://ghproxy.net/https://raw.githubusercontent.com/TZB679/myhomepage/refs/heads/main/Assets/mobile/mobile1.jpg",
            "https://ghproxy.net/https://raw.githubusercontent.com/TZB679/myhomepage/refs/heads/main/Assets/mobile/mobile2.jpg",
            "https://ghproxy.net/https://raw.githubusercontent.com/TZB679/myhomepage/refs/heads/main/Assets/mobile/mobile4.jpg",
            "https://ghproxy.net/https://raw.githubusercontent.com/TZB679/myhomepage/refs/heads/main/Assets/mobile/mobile5.jpg"
        ];
        
        const bgElements = [
            document.getElementById('bg1'),
            document.getElementById('bg2'),
            document.getElementById('bg3'),
            document.getElementById('bg4'),
            document.getElementById('bg5')
        ];
        
        function isPortrait() {
            return window.innerHeight > window.innerWidth;
        }
        
        function updateAllBackgrounds() {
            const portraitMode = isPortrait();
            for (let i = 0; i < bgElements.length; i++) {
                const bgDiv = bgElements[i];
                if (bgDiv) {
                    const imgUrl = portraitMode ? portraitImages[i] : landscapeImages[i];
                    if (imgUrl && imgUrl.trim() !== "") {
                        bgDiv.style.backgroundImage = `url('${imgUrl}')`;
                    }
                }
            }
        }
        
        let resizeTimer;
        function handleOrientationChange() {
            if (resizeTimer) clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                updateAllBackgrounds();
            }, 80);
        }
        
        window.addEventListener('resize', handleOrientationChange);
        window.addEventListener('orientationchange', function() {
            setTimeout(updateAllBackgrounds, 30);
        });
        updateAllBackgrounds();
        
        // ---------- 滚动与交互模块 ----------
        const sections = document.querySelectorAll('.section');
        const container = document.getElementById('scrollContainer');
        const dotNav = document.getElementById('dotNav');
        let currentActive = 0;
        let ticking = false;
        
        function buildDots() {
            dotNav.innerHTML = '';
            sections.forEach((_, idx) => {
                const dot = document.createElement('div');
                dot.classList.add('dot-item');
                if (idx === 0) dot.classList.add('active');
                dot.addEventListener('click', (e) => {
                    e.preventDefault();
                    sections[idx].scrollIntoView({ behavior: 'smooth', block: 'start' });
                });
                dotNav.appendChild(dot);
            });
        }
        
        function updateActiveDot() {
            if (ticking) return;
            ticking = true;
            requestAnimationFrame(() => {
                let bestIndex = 0;
                const scrollTop = container.scrollTop;
                const viewportMid = scrollTop + container.clientHeight / 2;
                let minDistance = Infinity;
                sections.forEach((sec, i) => {
                    const rect = sec.getBoundingClientRect();
                    const absoluteTop = rect.top + container.scrollTop;
                    const absoluteBottom = absoluteTop + rect.height;
                    const center = (absoluteTop + absoluteBottom) / 2;
                    const distance = Math.abs(center - viewportMid);
                    if (distance < minDistance) {
                        minDistance = distance;
                        bestIndex = i;
                    }
                });
                if (currentActive !== bestIndex) {
                    currentActive = bestIndex;
                    const dots = document.querySelectorAll('.dot-item');
                    dots.forEach((dot, idx) => {
                        if (idx === currentActive) dot.classList.add('active');
                        else dot.classList.remove('active');
                    });
                }
                ticking = false;
            });
        }
        
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('in-view');
                }
            });
        }, { threshold: 0.25, rootMargin: "0px 0px -10px 0px" });
        sections.forEach(sec => observer.observe(sec));
        
        container.addEventListener('scroll', updateActiveDot);
        
        setTimeout(() => {
            sections.forEach(sec => {
                const rect = sec.getBoundingClientRect();
                const containerRect = container.getBoundingClientRect();
                if (rect.top < containerRect.bottom - 80 && rect.bottom > containerRect.top + 80) {
                    sec.classList.add('in-view');
                }
            });
            updateActiveDot();
        }, 150);
        
        buildDots();
        
        // ----- 轻提示组件 -----
        function showToast(msg, duration = 2200) {
            let toast = document.querySelector('.global-toast');
            if (!toast) {
                const div = document.createElement('div');
                div.className = 'global-toast';
                div.style.cssText = `position:fixed; bottom:25%; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.85); backdrop-filter:blur(12px); color:#fff; padding:10px 24px; border-radius:40px; font-size:14px; z-index:10000; max-width:85vw; text-align:center; pointer-events:none; font-weight:500; border:1px solid rgba(255,255,255,0.2); white-space:normal; word-break:break-word;`;
                document.body.appendChild(div);
                toast = div;
            }
            toast.innerText = msg;
            toast.style.opacity = '1';
            clearTimeout(window.toastTimer);
            window.toastTimer = setTimeout(() => {
                toast.style.opacity = '0';
            }, duration);
        }
        
        // ================= 核心：下载一首歌功能 =================
        // ★ 歌曲下载链接已填入您提供的地址 ★
        const songDownloadUrl = "https://ghproxy.net/https://raw.githubusercontent.com/TZB679/myhomepage/refs/heads/main/Assets/download.mp3";
        
        function downloadSingleSong() {
            if (!songDownloadUrl) {
                showToast("🎧 下载链接暂不可用，请稍后再试", 2000);
                return;
            }
            // 创建隐藏链接触发下载
            const link = document.createElement('a');
            link.href = songDownloadUrl;
            link.download = '';  // 尝试触发下载
            link.target = '_blank';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast("✨ 单曲下载已开始，享受音乐~", 1800);
        }
        
        const downloadBtn = document.getElementById('downloadSingleSongBtn');
        if (downloadBtn) {
            downloadBtn.addEventListener('click', (e) => {
                e.preventDefault();
                downloadSingleSong();
            });
        }
        
        // 其他交互
        function initClickHandlers() {
            const clickableElements = document.querySelectorAll('[data-url]');
            clickableElements.forEach(el => {
                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const url = el.getAttribute('data-url');
                    if (url && url.trim() !== '') {
                        window.open(url, '_blank');
                    }
                });
            });
            const buyBtn = document.getElementById('buyBtn');
            if (buyBtn) {
                buyBtn.addEventListener('click', () => {
                    window.open('https://shop.guoyue2010.top/', '_blank');
                });
            }
            const hifiCard = document.querySelector('.hifi-card');
            if (hifiCard) {
                hifiCard.style.cursor = 'pointer';
                hifiCard.addEventListener('click', () => {
                    showToast('🎧 HI-FI工作室即将上线，敬请期待！', 1800);
                });
            }
            const coreCards = document.querySelectorAll('.core-card');
            coreCards.forEach(card => {
                if (card.hasAttribute('data-url')) card.style.cursor = 'pointer';
            });
        }
        
        initClickHandlers();
        
        const style = document.createElement('style');
        style.textContent = `
            .section-bg::after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: brightness(0.88); z-index: 1; }
            .section, .section-content { will-change: transform; }
            .download-headphone { cursor: pointer; background: radial-gradient(circle at 30% 20%, #2c2f3a, #12141c); border: none; }
        `;
        document.head.appendChild(style);
    })();
</script>
</body>
</html>
