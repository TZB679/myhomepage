<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>TZB679の个人主页 | （新ui测试版）</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            overflow-x: hidden;
            font-family: "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0a0c15;
        }

        /* ========= 滚动容器 + 高性能滚动吸附 ========= */
        .scroll-container {
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            /* 提升滚动性能 */
            will-change: scroll-position;
        }

        /* 每个区块占满一屏，滚动吸附 */
        .section {
            scroll-snap-align: start;
            min-height: 100vh;
            height: 100vh;
            width: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            /* 硬件加速 */
            transform: translateZ(0);
            backface-visibility: hidden;
        }

        /* 区块内容容器 - 优化动画性能，使用transform而非margin/padding */
        .section-content {
            width: 90%;
            max-width: 1300px;
            margin: 0 auto;
            padding: 20px;
            z-index: 2;
            position: relative;
            opacity: 0;
            transform: translateY(30px) translateZ(0);
            transition: opacity 0.6s cubic-bezier(0.2, 0.9, 0.4, 1.1), transform 0.6s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            will-change: transform, opacity;
        }

        /* 入场动画触发类 */
        .section.in-view .section-content {
            opacity: 1;
            transform: translateY(0) translateZ(0);
        }

        /* 延迟动画辅助 */
        .delay-1 { transition-delay: 0.08s; }
        .delay-2 { transition-delay: 0.16s; }
        .delay-3 { transition-delay: 0.26s; }

        /* ========= 背景图统一样式（半透明叠加，提升文字可读性） ========= */
        .section-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 0;
            transform: translateZ(0);
        }
        .section-bg::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(3px);
            z-index: 1;
        }

        /* ========= 导航栏（固定顶部，保持原样） ========= */
        .header-nav {
            width: 100%;
            height: 60px;
            background-color: rgba(255,255,255,0.94);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            padding: 0 24px;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 32px;
            flex-wrap: nowrap;
        }
        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background-image: url("https://ghproxy.net/https://raw.githubusercontent.com/TZB679/myhomepage/refs/heads/main/Assets/small.png");
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
            border: 2px solid #409eff;
        }
        .nav-links {
            display: flex;
            gap: 36px;
        }
        .nav-links a {
            text-decoration: none;
            color: #1f2d3d;
            font-size: 16px;
            font-weight: 500;
            transition: color 0.2s;
        }
        .nav-links a:hover {
            color: #409eff;
        }

        @media (max-width: 680px) {
            .header-nav { padding: 0 16px; height: 56px; }
            .nav-left { gap: 16px; }
            .nav-links { gap: 18px; }
            .nav-links a { font-size: 13px; }
            .avatar { width: 34px; height: 34px; }
        }

        /* ========= 右侧导航圆点（更丝滑指示） ========= */
        .dot-nav {
            position: fixed;
            right: 24px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1001;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .dot-item {
            width: 10px;
            height: 10px;
            border-radius: 10px;
            background-color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.25s ease;
            border: none;
            padding: 0;
        }
        .dot-item.active {
            width: 28px;
            background-color: #409eff;
            box-shadow: 0 0 8px #409eff;
        }
        @media (max-width: 768px) {
            .dot-nav { right: 14px; gap: 10px; }
            .dot-item { width: 8px; height: 8px; }
            .dot-item.active { width: 22px; }
        }

        /* ========= 第一屏样式（欢迎屏+标签） ========= */
        .section-1 .section-content {
            text-align: center;
            color: white;
            text-shadow: 0 2px 12px rgba(0,0,0,0.5);
        }
        .main-title {
            font-size: clamp(2rem, 8vw, 4rem);
            font-weight: 700;
            margin-bottom: 18px;
            letter-spacing: 2px;
        }
        .sub-punch {
            font-size: clamp(1rem, 4vw, 1.5rem);

            opacity: 0.9;
        }
        .tag-group {
            display: flex;

            justify-content: center;

        }
        .tag {
            padding: 8px 26px;

            backdrop-filter: blur(8px);
            border-radius: 60px;

        .tag:hover {

        }
        @media (max-width: 550px) {
            .tag { padding: 6px 18px; font-size: 13px; }

        /* ========= 第二屏：核心服务卡片区（软件/音源/工具） ========= */
        .cards-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 28px;

            margin-top: 30px;
        }
        .core-card {

        }
        .core-card:hover {
            transform: translateY(-6px);

        }
        .card-icon-big {

        }
        .core-card h3 {
            color: white;
            font-size: 1.6rem;
            margin-bottom: 8px;
        }
        .core-card p {
            color: #ccc;
            font-size: 14px;
        }
        .section-title {
            font-size: clamp(1.6rem, 5vw, 2.4rem);
            color: white;
            text-align: center;
            margin-bottom: 40px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        @media (max-width: 700px) {
            .cards-grid { gap: 16px; }
            .core-card { padding: 20px 16px; min-width: 150px; }

        /* ========= 第三屏：超大下载按钮（10首歌曲） ========= */

            display: flex;
            flex-direction: column;

        .giant-download-btn {

        .giant-download-btn:hover {

        }
        .btn-icon {
            font-size: 48px;
            filter: drop-shadow(2px 4px 8px rgba(0,0,0,0.2));
        }
        .btn-text {
            font-size: clamp(1.5rem, 6vw, 2.4rem);

        .song-tip {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(12px);

        }
        @media (max-width: 650px) {

        /* ========= 第四屏：购买音源 + 愿景 ========= */
        .shop-row {

        .shop-info {
            text-align: center;

        }
        .shop-info h2 {
            font-size: 2rem;

            margin-bottom: 16px;
        }
        .shop-btn {
            background: #ff7d00;
            padding: 14px 34px;
            border-radius: 50px;
            display: inline-block;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
            border: none;
        }
        .shop-btn:hover {
            background: #e56c00;

        }
        .vision-text {
            flex: 1;
            color: white;
            font-size: 1.2rem;
            line-height: 1.5;
            text-align: center;
            border-left: 2px solid #409eff;

        }
        @media (max-width: 760px) {

        /* ========= 第五屏：HI-FI工作室 & 结尾 ========= */
        .hifi-card {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);

            text-align: center;

        .hifi-icon {
            font-size: 72px;
            margin-bottom: 24px;
        }
        .hifi-title {

        }
        .hifi-desc {
            color: #ddd;

            margin-bottom: 24px;
        }
        .footer-note {
            margin-top: 40px;
            font-size: 14px;
            color: #aaa;
        }

        /* 各区块单独背景图 (复用原有图片资源) */
        .bg-1 { background-image: url('https://ghproxy.net/https://raw.githubusercontent.com/TZB679/myhomepage/refs/heads/main/Assets/pic1.jpeg'); }
        .bg-2 { background-image: url('https://ghproxy.net/https://raw.githubusercontent.com/TZB679/myhomepage/refs/heads/main/Assets/pic2.png'); }
        .bg-3 { background-image: url('https://ghproxy.net/https://raw.githubusercontent.com/TZB679/myhomepage/refs/heads/main/Assets/pic3.jpg'); }

        .section-bg {
            background-size: cover;
            background-position: center 30%;
        }

        /* 全局toast轻提示 */
        .global-toast {
            transition: opacity 0.2s;
        }
    </style>
</head>

<script>
    (function() {
        // ---------- 高性能滚动翻页与Intersection Observer入场动画 ----------
        const sections = document.querySelectorAll('.section');
        const container = document.getElementById('scrollContainer');
        const dotNav = document.getElementById('dotNav');
        let currentActive = 0;
        let ticking = false;

        // 建立右侧圆点导航
        function buildDots() {
            dotNav.innerHTML = '';
            sections.forEach((_, idx) => {
                const dot = document.createElement('div');
                dot.classList.add('dot-item');
                if (idx === 0) dot.classList.add('active');
                dot.addEventListener('click', (e) => {
                    e.preventDefault();
                    const targetSection = sections[idx];
                    if (targetSection) {
                        targetSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                });
                dotNav.appendChild(dot);
            });
        }

        // 基于滚动位置高效更新圆点（使用requestAnimationFrame节流）
        function updateActiveDot() {
            if (ticking) return;
            ticking = true;
            requestAnimationFrame(() => {
                let bestIndex = 0;
                const scrollTop = container.scrollTop;
                const viewportMid = scrollTop + container.clientHeight / 2;
                let minDistance = Infinity;
                sections.forEach((sec, i) => {
                    const rect = sec.getBoundingClientRect();
                    const absoluteTop = rect.top + container.scrollTop;
                    const absoluteBottom = absoluteTop + rect.height;
                    const center = (absoluteTop + absoluteBottom) / 2;
                    const distance = Math.abs(center - viewportMid);
                    if (distance < minDistance) {
                        minDistance = distance;
                        bestIndex = i;
                    }
                });
                if (currentActive !== bestIndex) {
                    currentActive = bestIndex;
                    const dots = document.querySelectorAll('.dot-item');
                    dots.forEach((dot, idx) => {
                        if (idx === currentActive) dot.classList.add('active');
                        else dot.classList.remove('active');
                    });
                }
                ticking = false;
            });
        }

        // 使用 Intersection Observer 触发入场动画（低配设备友好，只增加class，轻量）
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('in-view');
                }
            });
        }, { threshold: 0.25, rootMargin: "0px 0px -10px 0px" });
        
        sections.forEach(sec => observer.observe(sec));

        // 监听滚动容器更新指示点 & 主动触发动画预检
        container.addEventListener('scroll', () => {
            updateActiveDot();
        });
        
        // 初始化位置及首次显示动画
        setTimeout(() => {
            sections.forEach(sec => {
                const rect = sec.getBoundingClientRect();
                const containerRect = container.getBoundingClientRect();
                if (rect.top < containerRect.bottom - 80 && rect.bottom > containerRect.top + 80) {
                    sec.classList.add('in-view');
                }
            });
            updateActiveDot();
        }, 150);

        buildDots();
        
        // ----- 超大下载按钮（10首歌曲，链接暂留空，用户后续填写）-----
        const downloadBtn = document.getElementById('downloadSongsBtn');
        // 预定义10个歌曲占位链接数组（空字符串供用户后续填入）
        // 为了方便后续维护，用户可在这里填入实际的歌曲下载直链
        const songLinks = [
            "",   // 第1首
            "",   // 第2首
            "",   // 第3首
            "",   // 第4首
            "",   // 第5首
            "",   // 第6首
            "",   // 第7首
            "",   // 第8首
            "",   // 第9首
            ""    // 第10首
        ];
        
        // 提供友好的批量下载功能：如果用户未填链接则提示，否则依次触发下载（或打包提示）
        function downloadSongs() {
            const validLinks = songLinks.filter(link => link && link.trim() !== "");
            if (validLinks.length === 0) {
                showToast('🎵 歌曲下载链接暂未配置，请在代码中 songLinks 数组填入10首歌曲的直链 ~', 2800);
                return;
            }
            // 如果只有部分链接被填写，提示具体数量，并依次打开（为了用户体验，避免过多弹窗拦截）
            if (validLinks.length < songLinks.length) {
                showToast(`🎧 当前已配置 ${validLinks.length} 首歌曲，开始下载...`, 2000);
            } else {
                showToast(`🎉 10首精选歌曲开始下载，享受音乐盛宴！`, 1800);
            }
            // 依次触发下载（在浏览器中通常是打开链接或触发下载，针对直链）
            // 为了不阻塞用户，创建一个异步队列，避免同时打开太多
            let index = 0;
            function openNext() {
                if (index >= songLinks.length) return;
                const link = songLinks[index];
                if (link && link.trim() !== "") {
                    // 创建一个隐藏的a标签触发下载/打开
                    const a = document.createElement('a');
                    a.href = link;
                    a.target = '_blank';
                    a.download = ''; // 如果链接支持下载属性，会尝试直接下载，否则新窗口打开
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    // 添加微小延迟避免被浏览器拦截过多弹窗
                    setTimeout(() => {
                        index++;
                        openNext();
                    }, 300);
                } else {
                    index++;
                    openNext();
                }
            }
            openNext();
        }
        
        if (downloadBtn) {
            downloadBtn.addEventListener('click', (e) => {
                e.preventDefault();
                downloadSongs();
            });
        }
        
        // 其他卡片和标签跳转逻辑
        function initClickHandlers() {
            const clickableElements = document.querySelectorAll('[data-url]');
            clickableElements.forEach(el => {
                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const url = el.getAttribute('data-url');
                    if (url && url.trim() !== '') {
                        window.open(url, '_blank');
                    }
                });
            });
            const buyBtn = document.getElementById('buyBtn');
            if (buyBtn) {
                buyBtn.addEventListener('click', () => {
                    window.open('https://shop.guoyue2010.top/', '_blank');
                });
            }
            const hifiCard = document.querySelector('.hifi-card');
            if (hifiCard) {
                hifiCard.style.cursor = 'pointer';
                hifiCard.addEventListener('click', () => {
                    showToast('🎧 HI-FI工作室即将上线，敬请期待！', 1800);
                });
            }
            // 重新绑定core-card事件防止遗漏
            const coreCards = document.querySelectorAll('.core-card');
            coreCards.forEach(card => {
                if (!card.hasAttribute('data-url')) return;
                card.style.cursor = 'pointer';
            });
        }
        
        function showToast(msg, duration = 2200) {
            let toast = document.querySelector('.global-toast');
            if (!toast) {
                const div = document.createElement('div');
                div.className = 'global-toast';
                div.style.cssText = `position:fixed; bottom:25%; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.85); backdrop-filter:blur(12px); color:#fff; padding:10px 24px; border-radius:40px; font-size:14px; z-index:10000; max-width:85vw; text-align:center; pointer-events:none; font-weight:500; border:1px solid rgba(255,255,255,0.2); white-space:normal; word-break:break-word;`;
                document.body.appendChild(div);
                toast = div;
            }
            toast.innerText = msg;
            toast.style.opacity = '1';
            clearTimeout(window.toastTimer);
            window.toastTimer = setTimeout(() => {
                toast.style.opacity = '0';
            }, duration);
        }

        initClickHandlers();
        
        // 添加样式提升兼容性 & 低配设备强制使用will-change优化
        const style = document.createElement('style');
        style.textContent = `
            .section-bg::after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: brightness(0.88); z-index: 0; }
            .section, .section-content, .giant-download-btn { will-change: transform; }
            .scroll-container { scrollbar-width: thin; }
        `;
        document.head.appendChild(style);
    })();
</script>
</body>
</html>
